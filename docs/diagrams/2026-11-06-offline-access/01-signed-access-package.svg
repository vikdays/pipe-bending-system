<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1960" viewBox="0 0 1900 1960" role="img"><title>Выдача и импорт прав пользователей</title><desc>UML-диаграмма последовательности. Проектное решение, ещё не реализованное в коде.</desc><rect width="1900" height="1960" fill="#ffffff" /><text x="45" y="48" fill="#203047" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="start">Выдача и импорт прав пользователей</text><text x="47" y="91" fill="#99610f" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">ПРОЕКТНОЕ РЕШЕНИЕ • В коде ещё не реализовано</text><text x="1780" y="48" fill="#526479" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">1 / 3</text><rect x="35" y="135" width="1830" height="1690" fill="none" stroke="#52657c" stroke-width="1.5" /><polygon points="35,135 101,135 101,157 88,170 35,170" fill="#ffffff" stroke="#52657c" stroke-width="1.2" /><text x="47" y="159" fill="#203047" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">sd</text><circle cx="135" cy="205" r="13" fill="#ffffff" stroke="#203047" stroke-width="2" /><polyline points="135,218 135,257" fill="none" stroke="#52657c" stroke-width="2" stroke-linejoin="round" /><polyline points="110,234 160,234" fill="none" stroke="#52657c" stroke-width="2" stroke-linejoin="round" /><polyline points="112,275 135,257 158,275" fill="none" stroke="#52657c" stroke-width="2" stroke-linejoin="round" /><text x="135" y="309" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">Руководитель</text><polyline points="135,325 135,1810" fill="none" stroke="#a1adbb" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="7 6" /><rect x="380" y="190" width="280" height="94" fill="#edf3fb" stroke="#52657c" stroke-width="1.5" /><text x="520.0" y="228.0" fill="#203047" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">:Приложение ПК</text><text x="520.0" y="256.15999999999997" fill="#203047" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">руководителя</text><polyline points="520,325 520,1810" fill="none" stroke="#a1adbb" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="7 6" /><rect x="755" y="190" width="280" height="94" fill="#edf3fb" stroke="#52657c" stroke-width="1.5" /><text x="895.0" y="228.0" fill="#203047" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">:Файл на</text><text x="895.0" y="256.15999999999997" fill="#203047" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">носителе</text><polyline points="895,325 895,1810" fill="none" stroke="#a1adbb" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="7 6" /><rect x="1125" y="190" width="280" height="94" fill="#edf3fb" stroke="#52657c" stroke-width="1.5" /><text x="1265.0" y="228.0" fill="#203047" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">:Сервис допусков</text><text x="1265.0" y="256.15999999999997" fill="#203047" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">планшета</text><polyline points="1265,325 1265,1810" fill="none" stroke="#a1adbb" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="7 6" /><rect x="1580" y="190" width="280" height="94" fill="#edf3fb" stroke="#52657c" stroke-width="1.5" /><text x="1720.0" y="228.0" fill="#203047" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">:Хранилища</text><text x="1720.0" y="256.15999999999997" fill="#203047" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">планшета</text><polyline points="1720,325 1720,1810" fill="none" stroke="#a1adbb" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="7 6" /><rect x="60" y="340" width="1780" height="76" fill="#fff5de" stroke="#c5a46c" stroke-width="1" /><text x="75" y="368.0" fill="#526479" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">Предусловие: на планшете настроено доверие к ПК (лист 2); руководитель открыл режим администрирования. Хранилища планшета: SQLite для прав и версий, SecureStore для доверенного</text><text x="75" y="392.32" fill="#526479" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">ключа.</text><rect x="513" y="455" width="14" height="210" fill="#dce8f6" stroke="#52657c" stroke-width="1" /><rect x="1258" y="735" width="14" height="1030" fill="#dce8f6" stroke="#52657c" stroke-width="1" /><text x="327.5" y="459" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">1. Изменить допуск машиниста</text><polyline points="135,475 520,475" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="520,475 508.0,481.0 508.0,469.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><text x="539" y="525" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">2. Проверить права admin;</text><text x="539" y="549" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">сформировать новую версию v</text><polyline points="527,565 648,565 648,595 527,595" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="527,595 539.0,589.0 539.0,601.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><text x="707.5" y="620" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">3. Записать подписанный</text><text x="707.5" y="644" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">полный список прав</text><polyline points="520,660 895,660" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="895,660 883.0,666.0 883.0,654.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><text x="700.0" y="734" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">4. Импортировать пакет прав</text><polyline points="135,750 1265,750" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="1265,750 1253.0,756.0 1253.0,744.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><text x="1080.0" y="824" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">5. Прочитать выбранный файл</text><polyline points="1265,840 895,840" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="895,840 907.0,834.0 907.0,846.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><text x="1080.0" y="899" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">6. Данные пакета + подпись</text><polyline points="895,915 1265,915" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="7 6" /><polyline points="1253.0,921.0 1265,915 1253.0,909.0" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><text x="1492.5" y="955" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">7. Получить ключ ПК</text><text x="1492.5" y="979" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">и принятую версию</text><polyline points="1265,995 1720,995" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="1720,995 1708.0,1001.0 1708.0,989.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><text x="1492.5" y="1049" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">8. Ключ, источник, версия</text><polyline points="1720,1065 1265,1065" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="7 6" /><polyline points="1277.0,1059.0 1265,1065 1277.0,1071.0" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><text x="1284" y="1110" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">9. Проверить роль admin, схему,</text><text x="1284" y="1134" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">подпись, источник и версию</text><polyline points="1272,1150 1393,1150 1393,1180 1272,1180" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="1272,1180 1284.0,1174.0 1284.0,1186.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><rect x="55" y="1220" width="1790" height="575" fill="none" stroke="#52657c" stroke-width="1.5" /><polygon points="55,1220 135,1220 135,1242 122,1255 55,1255" fill="#ffffff" stroke="#52657c" stroke-width="1.2" /><text x="67" y="1244" fill="#203047" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">alt</text><text x="153" y="1248" fill="#526479" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">[проверки успешны; версия новее принятой]</text><polyline points="55,1580 1845,1580" fill="none" stroke="#52657c" stroke-width="1" stroke-linejoin="round" stroke-dasharray="7 6" /><text x="75" y="1610" fill="#526479" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">[проверка не пройдена / версия уже применена]</text><text x="1492.5" y="1290" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">10. В транзакции SQLite:</text><text x="1492.5" y="1314" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">применить права и версию</text><polyline points="1265,1330 1720,1330" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="1720,1330 1708.0,1336.0 1708.0,1324.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><text x="1492.5" y="1384" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">11. Пакет применён</text><polyline points="1720,1400 1265,1400" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="7 6" /><polyline points="1277.0,1394.0 1265,1400 1277.0,1406.0" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><text x="1284" y="1444" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">12. Завершить сессии входа</text><polyline points="1272,1460 1393,1460 1393,1490 1272,1490" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="1272,1490 1284.0,1484.0 1284.0,1496.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><text x="700.0" y="1524" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">13. Права обновлены</text><polyline points="1265,1540 135,1540" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="7 6" /><polyline points="147.0,1534.0 135,1540 147.0,1546.0" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><text x="700.0" y="1675" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">14. Оставить прежние права;</text><text x="700.0" y="1699" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">показать причину</text><polyline points="1265,1715 135,1715" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="7 6" /><polyline points="147.0,1709.0 135,1715 147.0,1721.0" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><text x="48" y="1859.0" fill="#526479" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">Подпись подтверждает источник и целостность файла. Пароли и токены ПК в пакет не входят; подпись не шифрует его содержимое.</text><text x="48" y="1919.0" fill="#526479" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">Блокировка с ПК начинает действовать после получения и применения обновления на планшете.</text></svg>