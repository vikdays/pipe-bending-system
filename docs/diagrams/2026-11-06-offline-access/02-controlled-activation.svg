<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1950" height="2240" viewBox="0 0 1950 2240" role="img"><title>Доверенная настройка и активация машиниста</title><desc>UML-диаграмма последовательности. Проектное решение, ещё не реализованное в коде.</desc><rect width="1950" height="2240" fill="#ffffff" /><text x="45" y="48" fill="#203047" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="start">Доверенная настройка и активация машиниста</text><text x="47" y="91" fill="#99610f" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">ПРОЕКТНОЕ РЕШЕНИЕ • В коде ещё не реализовано</text><text x="1830" y="48" fill="#526479" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">2 / 3</text><rect x="35" y="135" width="1880" height="1970" fill="none" stroke="#52657c" stroke-width="1.5" /><polygon points="35,135 101,135 101,157 88,170 35,170" fill="#ffffff" stroke="#52657c" stroke-width="1.2" /><text x="47" y="159" fill="#203047" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">sd</text><circle cx="125" cy="205" r="13" fill="#ffffff" stroke="#203047" stroke-width="2" /><polyline points="125,218 125,257" fill="none" stroke="#52657c" stroke-width="2" stroke-linejoin="round" /><polyline points="100,234 150,234" fill="none" stroke="#52657c" stroke-width="2" stroke-linejoin="round" /><polyline points="102,275 125,257 148,275" fill="none" stroke="#52657c" stroke-width="2" stroke-linejoin="round" /><text x="125" y="309" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">Руководитель</text><polyline points="125,325 125,2090" fill="none" stroke="#a1adbb" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="7 6" /><circle cx="430" cy="205" r="13" fill="#ffffff" stroke="#203047" stroke-width="2" /><polyline points="430,218 430,257" fill="none" stroke="#52657c" stroke-width="2" stroke-linejoin="round" /><polyline points="405,234 455,234" fill="none" stroke="#52657c" stroke-width="2" stroke-linejoin="round" /><polyline points="407,275 430,257 453,275" fill="none" stroke="#52657c" stroke-width="2" stroke-linejoin="round" /><text x="430" y="309" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">Машинист</text><polyline points="430,325 430,2090" fill="none" stroke="#a1adbb" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="7 6" /><rect x="615" y="190" width="280" height="94" fill="#edf3fb" stroke="#52657c" stroke-width="1.5" /><text x="755.0" y="228.0" fill="#203047" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">:Приложение</text><text x="755.0" y="256.15999999999997" fill="#203047" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">планшета</text><polyline points="755,325 755,2090" fill="none" stroke="#a1adbb" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="7 6" /><rect x="950" y="190" width="280" height="94" fill="#edf3fb" stroke="#52657c" stroke-width="1.5" /><text x="1090.0" y="228.0" fill="#203047" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">:Сервис локального</text><text x="1090.0" y="256.15999999999997" fill="#203047" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">доступа</text><polyline points="1090,325 1090,2090" fill="none" stroke="#a1adbb" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="7 6" /><rect x="1310" y="190" width="280" height="94" fill="#edf3fb" stroke="#52657c" stroke-width="1.5" /><text x="1450.0" y="228.0" fill="#203047" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">:SQLite</text><text x="1450.0" y="256.15999999999997" fill="#203047" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">планшета</text><polyline points="1450,325 1450,2090" fill="none" stroke="#a1adbb" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="7 6" /><rect x="1630" y="190" width="280" height="94" fill="#edf3fb" stroke="#52657c" stroke-width="1.5" /><text x="1770.0" y="228.0" fill="#203047" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">:SecureStore</text><polyline points="1770,325 1770,2090" fill="none" stroke="#a1adbb" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="7 6" /><rect x="60" y="340" width="1830" height="76" fill="#fff5de" stroke="#c5a46c" stroke-width="1" /><text x="75" y="368.0" fill="#526479" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">Первичная настройка выполняется при физическом контроле руководителя. Отпечаток открытого ключа сравнивается с экраном доверенного ПК. Показан успешный сценарий.</text><rect x="1083" y="590" width="14" height="270" fill="#dce8f6" stroke="#52657c" stroke-width="1" /><rect x="1083" y="1160" width="14" height="860" fill="#dce8f6" stroke="#52657c" stroke-width="1" /><text x="440.0" y="435" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">1. Выбрать ключ ПК;</text><text x="440.0" y="459" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">сверить его отпечаток</text><polyline points="125,475 755,475" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="755,475 743.0,481.0 743.0,469.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><text x="440.0" y="520" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">2. Задать локальный пароль</text><text x="440.0" y="544" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">режима администрирования</text><polyline points="125,560 755,560" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="755,560 743.0,566.0 743.0,554.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><text x="922.5" y="634" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">3. Инициализировать доверие</text><polyline points="755,650 1090,650" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="1090,650 1078.0,656.0 1078.0,644.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><text x="1109" y="690" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">4. Получить salt + KDF-verifier</text><text x="1109" y="714" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">пароля руководителя</text><polyline points="1097,730 1218,730 1218,760 1097,760" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="1097,760 1109.0,754.0 1109.0,766.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><text x="1430.0" y="780" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">5. Сохранить ключ ПК</text><text x="1430.0" y="804" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">и verifier руководителя</text><polyline points="1090,820 1770,820" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="1770,820 1758.0,826.0 1758.0,814.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><text x="922.5" y="860" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">6. Первичная настройка</text><text x="922.5" y="884" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">завершена</text><polyline points="1090,900 755,900" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="7 6" /><polyline points="767.0,894.0 755,900 767.0,906.0" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><rect x="620" y="945" width="1245" height="80" fill="#ffffff" stroke="#52657c" stroke-width="1.5" /><polygon points="620,945 700,945 700,967 687,980 620,980" fill="#ffffff" stroke="#52657c" stroke-width="1.2" /><text x="632" y="969" fill="#203047" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">ref</text><text x="1285.0" y="977.0" fill="#203047" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">Выдача и импорт подписанного пакета прав — лист 1</text><text x="440.0" y="1070" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">7. Войти в режим руководителя;</text><text x="440.0" y="1094" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">подтвердить личность машиниста</text><polyline points="125,1110 755,1110" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="755,1110 743.0,1116.0 743.0,1104.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><text x="922.5" y="1160" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">8. Запросить активацию</text><text x="922.5" y="1184" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">учётки operatorId</text><polyline points="755,1200 1090,1200" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="1090,1200 1078.0,1206.0 1078.0,1194.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><text x="1109" y="1240" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">9. Проверить полномочия</text><text x="1109" y="1264" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">руководителя</text><polyline points="1097,1280 1218,1280 1218,1310 1097,1310" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="1097,1310 1109.0,1304.0 1109.0,1316.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><text x="1270.0" y="1330" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">10. Проверить допуск operatorId</text><text x="1270.0" y="1354" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">в актуальном списке прав</text><polyline points="1090,1370 1450,1370" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="1450,1370 1438.0,1376.0 1438.0,1364.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><text x="1270.0" y="1424" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">11. Пользователь допущен</text><polyline points="1450,1440 1090,1440" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="7 6" /><polyline points="1102.0,1434.0 1090,1440 1102.0,1446.0" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><text x="922.5" y="1490" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">12. Разрешить задание</text><text x="922.5" y="1514" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">локального пароля машиниста</text><polyline points="1090,1530 755,1530" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="7 6" /><polyline points="767.0,1524.0 755,1530 767.0,1536.0" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><text x="592.5" y="1604" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">13. Задать свой пароль</text><polyline points="430,1620 755,1620" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="755,1620 743.0,1626.0 743.0,1614.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><text x="922.5" y="1684" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">14. Завершить активацию</text><polyline points="755,1700 1090,1700" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="1090,1700 1078.0,1706.0 1078.0,1694.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><text x="1109" y="1740" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">15. Получить salt + KDF-verifier</text><text x="1109" y="1764" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">пароля машиниста</text><polyline points="1097,1780 1218,1780 1218,1810 1097,1810" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="1097,1810 1109.0,1804.0 1109.0,1816.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><text x="1430.0" y="1854" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">16. Сохранить verifier(operatorId)</text><polyline points="1090,1870 1770,1870" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="1770,1870 1758.0,1876.0 1758.0,1864.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><text x="1270.0" y="1934" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">17. Отметить локальную активацию</text><polyline points="1090,1950 1450,1950" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="1450,1950 1438.0,1956.0 1438.0,1944.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><text x="922.5" y="1990" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">18. Учётная запись</text><text x="922.5" y="2014" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">активирована</text><polyline points="1090,2030 755,2030" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="7 6" /><polyline points="767.0,2024.0 755,2030 767.0,2036.0" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><text x="48" y="2129.0" fill="#526479" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">Активация запрещена без полномочий руководителя и действующего допуска. Незавершённая активация не разрешает вход.</text><text x="48" y="2189.0" fill="#526479" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">Verifier — соль, параметры KDF и результат проверки пароля; исходный пароль не сохраняется и не переносится на носителе.</text></svg>