<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1950" height="2130" viewBox="0 0 1950 2130" role="img"><title>Локальный вход и проверка прав перед сеансом</title><desc>UML-диаграмма последовательности. Проектное решение, ещё не реализованное в коде.</desc><rect width="1950" height="2130" fill="#ffffff" /><text x="45" y="48" fill="#203047" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="start">Локальный вход и проверка прав перед сеансом</text><text x="47" y="91" fill="#99610f" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">ПРОЕКТНОЕ РЕШЕНИЕ • В коде ещё не реализовано</text><text x="1830" y="48" fill="#526479" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">3 / 3</text><rect x="35" y="135" width="1880" height="1860" fill="none" stroke="#52657c" stroke-width="1.5" /><polygon points="35,135 101,135 101,157 88,170 35,170" fill="#ffffff" stroke="#52657c" stroke-width="1.2" /><text x="47" y="159" fill="#203047" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">sd</text><circle cx="140" cy="205" r="13" fill="#ffffff" stroke="#203047" stroke-width="2" /><polyline points="140,218 140,257" fill="none" stroke="#52657c" stroke-width="2" stroke-linejoin="round" /><polyline points="115,234 165,234" fill="none" stroke="#52657c" stroke-width="2" stroke-linejoin="round" /><polyline points="117,275 140,257 163,275" fill="none" stroke="#52657c" stroke-width="2" stroke-linejoin="round" /><text x="140" y="309" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">Машинист</text><polyline points="140,325 140,1980" fill="none" stroke="#a1adbb" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="7 6" /><rect x="405" y="190" width="280" height="94" fill="#edf3fb" stroke="#52657c" stroke-width="1.5" /><text x="545.0" y="228.0" fill="#203047" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">:Приложение</text><text x="545.0" y="256.15999999999997" fill="#203047" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">планшета</text><polyline points="545,325 545,1980" fill="none" stroke="#a1adbb" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="7 6" /><rect x="805" y="190" width="280" height="94" fill="#edf3fb" stroke="#52657c" stroke-width="1.5" /><text x="945.0" y="228.0" fill="#203047" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">:Сервис локального</text><text x="945.0" y="256.15999999999997" fill="#203047" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">доступа</text><polyline points="945,325 945,1980" fill="none" stroke="#a1adbb" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="7 6" /><rect x="1205" y="190" width="280" height="94" fill="#edf3fb" stroke="#52657c" stroke-width="1.5" /><text x="1345.0" y="228.0" fill="#203047" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">:SQLite</text><text x="1345.0" y="256.15999999999997" fill="#203047" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">планшета</text><polyline points="1345,325 1345,1980" fill="none" stroke="#a1adbb" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="7 6" /><rect x="1630" y="190" width="280" height="94" fill="#edf3fb" stroke="#52657c" stroke-width="1.5" /><text x="1770.0" y="228.0" fill="#203047" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">:SecureStore</text><polyline points="1770,325 1770,1980" fill="none" stroke="#a1adbb" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="7 6" /><rect x="60" y="340" width="1830" height="70" fill="#fff5de" stroke="#c5a46c" stroke-width="1" /><text x="75" y="368.0" fill="#526479" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">Предусловие: доверие к ПК настроено, пакет прав загружен, учётка машиниста активирована. Подключение к ПК и Интернету не используется.</text><rect x="938" y="545" width="14" height="1300" fill="#dce8f6" stroke="#52657c" stroke-width="1" /><text x="342.5" y="459" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">1. Ввести логин и пароль</text><polyline points="140,475 545,475" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="545,475 533.0,481.0 533.0,469.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><text x="745.0" y="544" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">2. Проверить локальный вход</text><polyline points="545,560 945,560" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="945,560 933.0,566.0 933.0,554.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><text x="1145.0" y="610" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">3. Прочитать пользователя,</text><text x="1145.0" y="634" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">права, версию и лимит попыток</text><polyline points="945,650 1345,650" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="1345,650 1333.0,656.0 1333.0,644.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><text x="1145.0" y="709" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">4. Локальные данные</text><polyline points="1345,725 945,725" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="7 6" /><polyline points="957.0,719.0 945,725 957.0,731.0" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><text x="1357.5" y="799" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">5. Получить verifier пользователя</text><polyline points="945,815 1770,815" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="1770,815 1758.0,821.0 1758.0,809.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><text x="1357.5" y="874" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">6. Соль, hash и параметры KDF</text><polyline points="1770,890 945,890" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="7 6" /><polyline points="957.0,884.0 945,890 957.0,896.0" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><text x="964" y="940" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">7. Проверить пароль, активацию,</text><text x="964" y="964" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">допуск и ограничение попыток</text><polyline points="952,980 1073,980 1073,1010 952,1010" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="952,1010 964.0,1004.0 964.0,1016.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><rect x="55" y="1050" width="1840" height="920" fill="none" stroke="#52657c" stroke-width="1.5" /><polygon points="55,1050 135,1050 135,1072 122,1085 55,1085" fill="#ffffff" stroke="#52657c" stroke-width="1.2" /><text x="67" y="1074" fill="#203047" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">alt</text><text x="153" y="1078" fill="#526479" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">[ошибка пароля / нет допуска / вход временно ограничен]</text><polyline points="55,1280 1895,1280" fill="none" stroke="#52657c" stroke-width="1" stroke-linejoin="round" stroke-dasharray="7 6" /><text x="75" y="1310" fill="#526479" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">[проверки успешны]</text><text x="1145.0" y="1124" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">8. Учесть неудачную попытку</text><polyline points="945,1140 1345,1140" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="1345,1140 1333.0,1146.0 1333.0,1134.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><text x="745.0" y="1209" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">9. Отказать; сессию не создавать</text><polyline points="945,1225 545,1225" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="7 6" /><polyline points="557.0,1219.0 545,1225 557.0,1231.0" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><text x="964" y="1316" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">10. Создать сессию входа в</text><text x="964" y="1340" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">памяти:</text><text x="964" y="1364" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">userId, role, версия прав</text><polyline points="952,1380 1073,1380 1073,1410 952,1410" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="952,1410 964.0,1404.0 964.0,1416.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><text x="745.0" y="1444" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">11. Вход выполнен</text><polyline points="945,1460 545,1460" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="7 6" /><polyline points="557.0,1454.0 545,1460 557.0,1466.0" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><text x="342.5" y="1534" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">12. Начать сеанс по заданию</text><polyline points="140,1550 545,1550" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="545,1550 533.0,1556.0 533.0,1544.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><text x="745.0" y="1619" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">13. Запросить начало сеанса</text><polyline points="545,1635 945,1635" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="945,1635 933.0,1641.0 933.0,1629.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><text x="1145.0" y="1690" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">14. В транзакции: сверить права</text><text x="1145.0" y="1714" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">и версию; создать сеанс гибки</text><polyline points="945,1730 1345,1730" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><polygon points="1345,1730 1333.0,1736.0 1333.0,1724.0" fill="#52657c" stroke="#52657c" stroke-width="1" /><text x="1145.0" y="1799" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">15. bendingSessionId / отказ</text><polyline points="1345,1815 945,1815" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="7 6" /><polyline points="957.0,1809.0 945,1815 957.0,1821.0" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><text x="745.0" y="1869" fill="#203047" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">16. Результат операции</text><polyline points="945,1885 545,1885" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="7 6" /><polyline points="557.0,1879.0 545,1885 557.0,1891.0" fill="none" stroke="#52657c" stroke-width="1.7" stroke-linejoin="round" /><text x="48" y="2039.0" fill="#526479" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">Права проверяются при каждой защищённой операции. Смена версии прав делает прежнюю сессию входа недействительной.</text><text x="48" y="2099.0" fill="#526479" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">После перезапуска нужен новый вход. Производственный сеанс и подтверждённые измерения сохраняются отдельно в SQLite.</text></svg>